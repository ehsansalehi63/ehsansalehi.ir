<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.003/Vazirmatn-font-face.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width: 1080px;
  height: 1920px;
  font-family: 'Vazirmatn', sans-serif;
  background: url('https://media.base44.com/images/public/6a6f623f483e55c56d55ce16/b43d00e8a_generated_image.png') center/cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding: 0 50px 150px;
  position: relative;
  overflow: hidden;
}
body::before {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 65%;
  background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.75) 35%, rgba(0,0,0,0) 100%);
  z-index: 0;
}
.badge {
  position: absolute;
  top: 80px;
  right: 60px;
  z-index: 2;
  background: linear-gradient(135deg, #7c3aed, #c026d3);
  color: white;
  padding: 16px 36px;
  border-radius: 50px;
  font-size: 32px;
  font-weight: 700;
  box-shadow: 0 4px 20px rgba(124,58,237,0.4);
}
.text-box {
  position: relative;
  z-index: 1;
  text-align: center;
  width: 100%;
}
h1 {
  font-size: 54px;
  font-weight: 800;
  line-height: 1.5;
  color: #ffffff;
  text-shadow: 0 4px 24px rgba(0,0,0,0.9), 0 0 60px rgba(168,85,247,0.3);
  white-space: pre-line;
}
.date-badge {
  margin-top: 30px;
  font-size: 24px;
  font-weight: 600;
  color: #c084fc;
  opacity: 0.85;
}
.brand {
  margin-top: 15px;
  font-size: 28px;
  font-weight: 600;
  color: #ffffff;
  opacity: 0.7;
}
</style>
</head>
<body>
  <div class="badge">خبر ۱</div>
  <div class="text-box">
    <h1>۱. علی‌بابا مدل جدید Qwen را معرفی کرد\nبا عملکردی هم‌تراز Anthropic</h1>
    <div class="date-badge">۴ آگوست ۲۰۲۶</div>
    <div class="brand">@ehsansalehi.ir</div>
  </div>
</body>
</html>
