name: Sync Env Config (relay to site)

on:
  workflow_dispatch:

concurrency:
  group: sync-env
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1) Read relay config from Hostinger via SSH ──
      - name: Read relay config from Hostinger
        id: relay
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_IP }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            CONFIG="$HOME/public_html/relay-config.php"
            if [ ! -f "$CONFIG" ]; then
              echo "ERROR: relay-config.php not found"
              exit 1
            fi
            php -r "
            \$c = include '$CONFIG';
            echo 'GATE_KEY=' . \$c['ai_gateway_key'] . PHP_EOL;
            echo 'RELAY_SECRET=' . \$c['relay_secret'] . PHP_EOL;
            echo 'HAS_OPENAI=' . (empty(\$c['openai_api_key']) ? 'EMPTY' : 'SET') . PHP_EOL;
            "

      # ── 2) Parse and mask values ──
      - name: Parse relay config
        run: |
          set -euo pipefail
          OUTPUT='${{ steps.relay.outputs.stdout }}'
          GATE_KEY=$(echo "$OUTPUT" | grep '^GATE_KEY=' | head -1 | cut -d= -f2-)
          RSECRET=$(echo "$OUTPUT" | grep '^RELAY_SECRET=' | head -1 | cut -d= -f2-)
          HAS_OPENAI=$(echo "$OUTPUT" | grep '^HAS_OPENAI=' | head -1 | cut -d= -f2-)

          if [ -z "$GATE_KEY" ]; then
            echo "::error::ai_gateway_key is empty on relay"
            exit 1
          fi
          if [ -z "$RSECRET" ]; then
            echo "::error::relay_secret is empty on relay"
            exit 1
          fi

          echo "::add-mask::$GATE_KEY"
          echo "::add-mask::$RSECRET"
          echo "GATE_KEY=$GATE_KEY" >> $GITHUB_ENV
          echo "RSECRET=$RSECRET" >> $GITHUB_ENV
          echo "::notice::Relay config read — gate_key: SET, relay_secret: SET, openai_api_key: $HAS_OPENAI"

      # ── 3) Set env vars on Mizbanfa via cPanel API ──
      - name: Set env vars on Mizbanfa
        run: |
          set -euo pipefail
          CH="${{ secrets.CPANEL_HOST }}"
          CU="${{ secrets.CPANEL_USER }}"
          CT="${{ secrets.CPANEL_TOKEN }}"
          APP_DIR="${{ secrets.CPANEL_APP_DIR }}"

          echo "=== cPanel: $CH / $CU / app=$APP_DIR ==="

          # 3a) Get Node.js app list
          echo "--- Listing Node.js apps ---"
          APPS=$(curl -sS -k --max-time 15 \
            "https://${CH}:2083/execute/Node/get_applications" \
            -H "Authorization: cpanel ${CU}:${CT}")
          echo "$APPS" | head -c 1000
          echo ""

          # 3b) Try Environment API (user-level env vars)
          echo "--- Setting OPENAI_API_KEY via Environment API ---"
          R1=$(curl -sS -k --max-time 15 \
            "https://${CH}:2083/execute/Environment/set_user_environment_variable" \
            -H "Authorization: cpanel ${CU}:${CT}" \
            -d "name=OPENAI_API_KEY&value=$GATE_KEY")
          echo "$R1" | head -c 300
          echo ""

          echo "--- Setting RELAY_SECRET via Environment API ---"
          R2=$(curl -sS -k --max-time 15 \
            "https://${CH}:2083/execute/Environment/set_user_environment_variable" \
            -H "Authorization: cpanel ${CU}:${CT}" \
            -d "name=RELAY_SECRET&value=$RSECRET")
          echo "$R2" | head -c 300
          echo ""

          # 3c) Try updating .env file via Fileman API
          echo "--- Reading .env file at $APP_DIR ---"
          ENV_READ=$(curl -sS -k --max-time 15 \
            "https://${CH}:2083/execute/Fileman/get_file_content" \
            -H "Authorization: cpanel ${CU}:${CT}" \
            -d "dir=$APP_DIR&file=.env")
          echo "$ENV_READ" | head -c 500
          echo ""

          # 3d) Also try /home/user/appdir path
          if echo "$ENV_READ" | grep -q '"error"'; then
            echo "--- Trying /home/${CU}/${APP_DIR} ---"
            ENV_READ2=$(curl -sS -k --max-time 15 \
              "https://${CH}:2083/execute/Fileman/get_file_content" \
              -H "Authorization: cpanel ${CU}:${CT}" \
              -d "dir=/home/${CU}/${APP_DIR}&file=.env")
            echo "$ENV_READ2" | head -c 500
          fi

      # ── 4) Test chain after sync ──
      - name: Test chain after sync
        run: |
          echo "Waiting 15s for changes to take effect..."
          sleep 15

          echo "=== Site health ==="
          curl -sS --max-time 15 "https://ehsansalehi.ir/api/deploy/health" 2>/dev/null | head -c 200
          echo ""
          echo "=== Relay health ==="
          curl -sS --max-time 15 "${{ secrets.RELAY_URL }}/health" 2>/dev/null
          echo ""
          echo "=== AI gateway test (direct to relay) ==="
          curl -sS --max-time 30 -X POST "${{ secrets.RELAY_URL }}/v1/chat/completions" \
            -H "Authorization: Bearer $GATE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"claude-opus-5","messages":[{"role":"user","content":"say OK"}],"max_tokens":16}' 2>&1 | head -c 500
          echo ""
          echo "=== Done ==="
