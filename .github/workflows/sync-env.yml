name: Sync Env Config (relay to site)

on:
  workflow_dispatch:

concurrency:
  group: sync-env
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1) Read relay config and upload .env to Mizbanfa all via SSH ──
      - name: Read relay config + sync to Mizbanfa
        id: relay
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_IP }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          capture_stdout: true
          script: |
            # Step A: Read relay config via PHP CLI
            cd "$HOME/public_html"
            PHP_OUT=$(php -r '
            $CONFIG = ["relay_secret" => "", "ai_gateway_key" => "", "openai_api_key" => "", "openai_base" => "https://agentrouter.org/v1", "anthropic_base" => "https://agentrouter.org", "anthropic_version" => "2023-06-01", "instagram_token" => "", "instagram_user_id" => "", "linkedin_token" => "", "linkedin_author" => "", "fb_token" => "", "fb_page_id" => "", "meta_version" => "v21.0", "sig_window" => 300];
            $cfgFile = __DIR__ . "/relay-config.php";
            if (is_file($cfgFile)) { $loaded = require $cfgFile; if (is_array($loaded)) $CONFIG = array_merge($CONFIG, $loaded); }
            foreach (["RELAY_SECRET" => "relay_secret", "AI_GATEWAY_KEY" => "ai_gateway_key", "OPENAI_API_KEY" => "openai_api_key"] as $env => $key) { $v = getenv($env); if ($v !== false && $v !== "") $CONFIG[$key] = $v; }
            echo $CONFIG["ai_gateway_key"] . "|" . $CONFIG["relay_secret"] . "|" . (empty($CONFIG["openai_api_key"]) ? "EMPTY" : "SET");
            ' 2>/dev/null)

            GATE_KEY=$(echo "$PHP_OUT" | cut -d'|' -f1)
            RSECRET=$(echo "$PHP_OUT" | cut -d'|' -f2)
            HAS_OAI=$(echo "$PHP_OUT" | cut -d'|' -f3)

            # If PHP CLI didn't get env vars, try .htaccess SetEnv
            if [ -z "$GATE_KEY" ]; then
              GATE_KEY=$(grep -i "^SetEnv.*AI_GATEWAY_KEY" "$HOME/public_html/.htaccess" 2>/dev/null | awk '{print $NF}' | tr -d '"' || echo "")
            fi
            if [ -z "$RSECRET" ]; then
              RSECRET=$(grep -i "^SetEnv.*RELAY_SECRET" "$HOME/public_html/.htaccess" 2>/dev/null | awk '{print $NF}' | tr -d '"' || echo "")
            fi

            # Output as base64 to avoid GitHub Actions output issues
            echo "RESULT=$(echo "${GATE_KEY}|${RSECRET}|${HAS_OAI}" | base64 -w0)"

      # ── 2) Parse and set env ──
      - name: Parse relay config
        run: |
          set -euo pipefail
          RAW='${{ steps.relay.outputs.stdout }}'
          echo "Raw output: $RAW"
          RESULT=$(echo "$RAW" | grep '^RESULT=' | cut -d= -f2-)
          DECODED=$(echo "$RESULT" | base64 -d 2>/dev/null || echo "")
          echo "Decoded: $DECODED"
          
          GATE_KEY=$(echo "$DECODED" | cut -d'|' -f1)
          RSECRET=$(echo "$DECODED" | cut -d'|' -f2)
          
          echo "GATE found: $([ -n "$GATE_KEY" ] && echo YES || echo NO)"
          echo "RSECRET found: $([ -n "$RSECRET" ] && echo YES || echo NO)"

          if [ -z "$GATE_KEY" ]; then
            echo "::warning::GATE_KEY not found — using RELAY_SECRET from GitHub Secrets"
            GATE_KEY="${{ secrets.RELAY_SECRET }}"
          fi
          if [ -z "$RSECRET" ]; then
            echo "::warning::RSECRET not found — using RELAY_SECRET from GitHub Secrets"
            RSECRET="${{ secrets.RELAY_SECRET }}"
          fi
          if [ -z "$GATE_KEY" ] || [ -z "$RSECRET" ]; then
            echo "::error::Could not get values" && exit 1
          fi

          echo "::add-mask::$GATE_KEY"
          echo "::add-mask::$RSECRET"
          echo "GATE_KEY=$GATE_KEY" >> $GITHUB_ENV
          echo "RSECRET=$RSECRET" >> $GITHUB_ENV

      # ── 3) Upload .env to Mizbanfa via FTP ──
      - name: Update .env on Mizbanfa via FTP
        run: |
          set -euo pipefail
          FTP_HOST="${{ secrets.FTP_SERVER }}"
          FTP_USER="${{ secrets.FTP_USERNAME }}"
          FTP_PASS="${{ secrets.FTP_PASSWORD }}"
          APP_DIR="${{ secrets.CPANEL_APP_DIR }}"

          echo "=== Downloading .env ==="
          curl -sS --max-time 30 "ftp://${FTP_USER}:${FTP_PASS}@${FTP_HOST}/${APP_DIR}/.env" -o /tmp/env.txt 2>/dev/null || echo "No .env found"

          if [ -s /tmp/env.txt ]; then
            echo "Found .env ($(wc -l < /tmp/env.txt) lines)"
            sed -i "s|^OPENAI_API_KEY=.*|OPENAI_API_KEY=$GATE_KEY|" /tmp/env.txt
            sed -i "s|^RELAY_SECRET=.*|RELAY_SECRET=$RSECRET|" /tmp/env.txt
            grep -q '^OPENAI_API_KEY=' /tmp/env.txt || echo "OPENAI_API_KEY=$GATE_KEY" >> /tmp/env.txt
            grep -q '^RELAY_SECRET=' /tmp/env.txt || echo "RELAY_SECRET=$RSECRET" >> /tmp/env.txt
          else
            echo "OPENAI_API_KEY=$GATE_KEY" > /tmp/env.txt
            echo "RELAY_SECRET=$RSECRET" >> /tmp/env.txt
          fi

          echo "=== Uploading .env ==="
          curl -sS --max-time 30 -T /tmp/env.txt "ftp://${FTP_USER}:${FTP_PASS}@${FTP_HOST}/${APP_DIR}/.env" 2>&1
          echo "Done"

      # ── 4) Test chain ──
      - name: Test chain
        run: |
          echo "Waiting 25s..."
          sleep 25
          echo "=== Site health ==="
          curl -sS --max-time 15 "https://ehsansalehi.ir/api/deploy/health" 2>/dev/null | head -c 200
          echo ""
          echo "=== Relay health ==="
          curl -sS --max-time 15 "${{ secrets.RELAY_URL }}/health" 2>/dev/null
          echo ""
          echo "=== AI gateway test ==="
          curl -sS --max-time 30 -X POST "${{ secrets.RELAY_URL }}/v1/chat/completions" \
            -H "Authorization: Bearer $GATE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"claude-opus-5","messages":[{"role":"user","content":"say OK"}],"max_tokens":16}' 2>&1 | head -c 500
          echo ""
