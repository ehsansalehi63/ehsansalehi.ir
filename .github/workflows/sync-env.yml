name: Sync Env Config (relay to site)

on:
  workflow_dispatch:

concurrency:
  group: sync-env
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1) Create temp PHP on Hostinger via SSH ──
      - name: Create temp config checker on Hostinger
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_IP }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            TMPF="$HOME/public_html/tmp-cfg-check-9x7.php"
            echo '<?php' > "$TMPF"
            echo '$CONFIG = ["relay_secret" => "", "ai_gateway_key" => "", "openai_api_key" => "", "openai_base" => "https://agentrouter.org/v1", "anthropic_base" => "https://agentrouter.org", "anthropic_version" => "2023-06-01", "instagram_token" => "", "instagram_user_id" => "", "linkedin_token" => "", "linkedin_author" => "", "fb_token" => "", "fb_page_id" => "", "meta_version" => "v21.0", "sig_window" => 300];' >> "$TMPF"
            echo '$cfgFile = __DIR__ . "/relay-config.php";' >> "$TMPF"
            echo 'if (is_file($cfgFile)) { $loaded = require $cfgFile; if (is_array($loaded)) $CONFIG = array_merge($CONFIG, $loaded); }' >> "$TMPF"
            echo 'foreach (["RELAY_SECRET" => "relay_secret", "AI_GATEWAY_KEY" => "ai_gateway_key", "OPENAI_API_KEY" => "openai_api_key"] as $env => $key) { $v = getenv($env); if ($v !== false && $v !== "") $CONFIG[$key] = $v; }' >> "$TMPF"
            echo 'header("Content-Type: text/plain");' >> "$TMPF"
            echo 'echo $CONFIG["ai_gateway_key"] . "|" . $CONFIG["relay_secret"] . "|" . (empty($CONFIG["openai_api_key"]) ? "EMPTY" : "SET");' >> "$TMPF"
            chmod 644 "$TMPF"
            echo "File created at: $TMPF"
            ls -la "$TMPF"

      # ── 2) Fetch config from GitHub runner (not from SSH) ──
      - name: Fetch relay config
        id: fetch
        run: |
          set -euo pipefail
          RELAY_DOMAIN="darkslategrey-woodcock-525023.hostingersite.com"
          echo "Fetching from https://${RELAY_DOMAIN}/tmp-cfg-check-9x7.php"
          RESULT=$(curl -sS --max-time 15 "https://${RELAY_DOMAIN}/tmp-cfg-check-9x7.php" 2>/dev/null || echo "")
          echo "Raw result (first 200 chars): $(echo "$RESULT" | head -c 200)"
          
          # Check if it's HTML (404 page)
          if echo "$RESULT" | grep -q "<html\|<!DOCTYPE\|Page Not Found"; then
            echo "::warning::Got 404/HTML instead of config — temp file not accessible via web"
            echo "HAS_CONFIG=false" >> $GITHUB_ENV
          else
            echo "HAS_CONFIG=true" >> $GITHUB_ENV
            GATE_KEY=$(echo "$RESULT" | cut -d'|' -f1)
            RSECRET=$(echo "$RESULT" | cut -d'|' -f2)
            
            if [ -n "$GATE_KEY" ] && [ -n "$RSECRET" ]; then
              echo "::add-mask::$GATE_KEY"
              echo "::add-mask::$RSECRET"
              echo "GATE_KEY=$GATE_KEY" >> $GITHUB_ENV
              echo "RSECRET=$RSECRET" >> $GITHUB_ENV
              echo "Found real config! GATE_KEY: SET, RSECRET: SET"
            else
              echo "::warning::Config values empty"
              echo "HAS_CONFIG=false" >> $GITHUB_ENV
            fi
          fi

      # ── 3) Clean up temp file ──
      - name: Delete temp file on Hostinger
        if: always()
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_IP }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            rm -f "$HOME/public_html/tmp-cfg-check-9x7.php"
            echo "Temp file deleted"

      # ── 4) Set fallback values if needed ──
      - name: Set fallback values
        if: env.HAS_CONFIG != 'true'
        run: |
          echo "::warning::Using RELAY_SECRET from GitHub Secrets as fallback"
          GATE_KEY="${{ secrets.RELAY_SECRET }}"
          RSECRET="${{ secrets.RELAY_SECRET }}"
          echo "::add-mask::$GATE_KEY"
          echo "::add-mask::$RSECRET"
          echo "GATE_KEY=$GATE_KEY" >> $GITHUB_ENV
          echo "RSECRET=$RSECRET" >> $GITHUB_ENV

      # ── 5) Upload .env to Mizbanfa via FTP ──
      - name: Update .env on Mizbanfa via FTP
        run: |
          set -euo pipefail
          FTP_HOST="${{ secrets.FTP_SERVER }}"
          FTP_USER="${{ secrets.FTP_USERNAME }}"
          FTP_PASS="${{ secrets.FTP_PASSWORD }}"
          APP_DIR="${{ secrets.CPANEL_APP_DIR }}"

          echo "=== Downloading .env from Mizbanfa ==="
          curl -sS --max-time 30 "ftp://${FTP_USER}:${FTP_PASS}@${FTP_HOST}/${APP_DIR}/.env" -o /tmp/env.txt 2>/dev/null || echo "No .env found"

          if [ -s /tmp/env.txt ]; then
            echo "Found .env ($(wc -l < /tmp/env.txt) lines)"
            sed -i "s|^OPENAI_API_KEY=.*|OPENAI_API_KEY=$GATE_KEY|" /tmp/env.txt
            sed -i "s|^RELAY_SECRET=.*|RELAY_SECRET=$RSECRET|" /tmp/env.txt
            grep -q '^OPENAI_API_KEY=' /tmp/env.txt || echo "OPENAI_API_KEY=$GATE_KEY" >> /tmp/env.txt
            grep -q '^RELAY_SECRET=' /tmp/env.txt || echo "RELAY_SECRET=$RSECRET" >> /tmp/env.txt
          else
            echo "OPENAI_API_KEY=$GATE_KEY" > /tmp/env.txt
            echo "RELAY_SECRET=$RSECRET" >> /tmp/env.txt
          fi

          echo "=== Uploading .env ==="
          curl -sS --max-time 30 -T /tmp/env.txt "ftp://${FTP_USER}:${FTP_PASS}@${FTP_HOST}/${APP_DIR}/.env" 2>&1
          echo "Done"

      # ── 6) Test chain ──
      - name: Test chain
        run: |
          echo "Waiting 25s..."
          sleep 25
          echo "=== Site health ==="
          curl -sS --max-time 15 "https://ehsansalehi.ir/api/deploy/health" 2>/dev/null | head -c 200
          echo ""
          echo "=== Relay health ==="
          curl -sS --max-time 15 "${{ secrets.RELAY_URL }}/health" 2>/dev/null
          echo ""
          echo "=== AI gateway test ==="
          curl -sS --max-time 30 -X POST "${{ secrets.RELAY_URL }}/v1/chat/completions" \
            -H "Authorization: Bearer $GATE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"claude-opus-5","messages":[{"role":"user","content":"say OK"}],"max_tokens":16}' 2>&1 | head -c 500
          echo ""
