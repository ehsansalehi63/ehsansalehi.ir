name: Sync Env Config (relay to site)

on:
  workflow_dispatch:

concurrency:
  group: sync-env
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1) Prepare .env from GitHub secrets ──
      - name: Prepare .env
        run: |
          set -euo pipefail
          GATE_KEY="${{ secrets.AI_GATEWAY_KEY }}"
          RSECRET="${{ secrets.RELAY_SECRET }}"

          if [ -z "$GATE_KEY" ]; then
            echo "::error::AI_GATEWAY_KEY secret is not set" && exit 1
          fi
          if [ -z "$RSECRET" ]; then
            echo "::error::RELAY_SECRET secret is not set" && exit 1
          fi

          echo "AI_GATEWAY_KEY: SET ✅"
          echo "RELAY_SECRET: SET ✅"

          echo "GATE_KEY=$GATE_KEY" >> $GITHUB_ENV
          echo "RSECRET=$RSECRET" >> $GITHUB_ENV

      # ── 2) Upload .env to Mizbanfa via FTP ──
      - name: Update .env on Mizbanfa via FTP
        run: |
          set -euo pipefail
          FTP_HOST="${{ secrets.FTP_SERVER }}"
          FTP_USER="${{ secrets.FTP_USERNAME }}"
          FTP_PASS="${{ secrets.FTP_PASSWORD }}"
          REMOTE_DIR="ehsansalehi.ir"

          echo "=== Downloading existing .env from Mizbanfa ==="
          curl -sS --max-time 30 "ftp://${FTP_USER}:${FTP_PASS}@${FTP_HOST}/${REMOTE_DIR}/.env" -o /tmp/env.txt 2>/dev/null || echo "No .env found"

          if [ -s /tmp/env.txt ]; then
            echo "Found .env ($(wc -l < /tmp/env.txt) lines)"
            sed -i "s|^OPENAI_API_KEY=.*|OPENAI_API_KEY=$GATE_KEY|" /tmp/env.txt
            sed -i "s|^RELAY_SECRET=.*|RELAY_SECRET=$RSECRET|" /tmp/env.txt
            grep -q '^OPENAI_API_KEY=' /tmp/env.txt || echo "OPENAI_API_KEY=$GATE_KEY" >> /tmp/env.txt
            grep -q '^RELAY_SECRET=' /tmp/env.txt || echo "RELAY_SECRET=$RSECRET" >> /tmp/env.txt
          else
            echo "OPENAI_API_KEY=$GATE_KEY" > /tmp/env.txt
            echo "RELAY_SECRET=$RSECRET" >> /tmp/env.txt
          fi

          echo "=== .env contents (masked) ==="
          sed 's/=.*/=***/' /tmp/env.txt

          echo "=== Uploading .env ==="
          curl -sS --max-time 30 -T /tmp/env.txt "ftp://${FTP_USER}:${FTP_PASS}@${FTP_HOST}/${REMOTE_DIR}/.env" 2>&1
          echo ""
          echo "Upload done"

      # ── 3) Test chain ──
      - name: Test chain
        run: |
          echo "Waiting 25s for cache refresh..."
          sleep 25
          echo "=== Site health ==="
          curl -sS --max-time 15 "https://ehsansalehi.ir/api/deploy/health" 2>/dev/null | head -c 200
          echo ""
          echo "=== Relay health ==="
          curl -sS --max-time 15 "${{ secrets.RELAY_URL }}/health" 2>/dev/null
          echo ""
          echo "=== AI gateway test ==="
          curl -sS --max-time 30 -X POST "${{ secrets.RELAY_URL }}/v1/chat/completions" \
            -H "Authorization: Bearer $GATE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"claude-sonnet-4-20250514","messages":[{"role":"user","content":"say OK"}],"max_tokens":16}' 2>&1 | head -c 500
          echo ""
