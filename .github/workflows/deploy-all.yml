# ═══════════════════════════════════════════════════════════════
#  دیپلوی کامل: سایت (FTP→میزبان‌فا) + رله (SSH→هاستینگر) + تست زنجیره
#
#  FTP  → میزبان‌فا (سایت اصلی Next.js)
#  SSH  → هاستینگر (رله PHP — شبکه‌های اجتماعی + هوش مصنوعی)
#  تست  → زنجیره سایت↔رله پس از دیپلوی
#
#  Secrets لازم (همه در GitHub Secrets تنظیم شده‌اند):
#    میزبان‌فا (FTP):
#      FTP_SERVER       آدرس FTP
#      FTP_USERNAME     نام کاربری
#      FTP_PASSWORD     رمز FTP
#    هاستینگر (SSH):
#      SSH_IP           آدرس IP
#      SSH_PORT         پورت SSH
#      SSH_USERNAME     نام کاربری
#      SSH_PASSWORD     رمز عبور
#    مشترک:
#      HEALTH_URL       https://ehsansalehi.ir/api/deploy/health
#      RELAY_URL        آدرس رله هاستینگر
#      RELAY_SECRET     رمز مشترک HMAC
#      CRON_SECRET      کلید تست سرتاسری سایت
# ═══════════════════════════════════════════════════════════════

name: Deploy All (Site FTP + Relay SSH)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-all
  cancel-in-progress: false

jobs:
  # ─── مرحله ۱: بیلد ──────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.[jt]s','**/*.[jt]sx') }}
          restore-keys: |
            next-${{ hashFiles('package-lock.json') }}-
            next-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ehsansalehi.ir
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Prepare standalone output
        run: |
          set -euo pipefail
          OUT=.next/standalone
          cp -r public "$OUT/public"
          mkdir -p "$OUT/.next"
          cp -r .next/static "$OUT/.next/static"
          mkdir -p "$OUT/tmp"
          date -u +%FT%TZ > "$OUT/tmp/restart.txt"
          cat > "$OUT/deploy-info.json" <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "shortSha": "${GITHUB_SHA:0:7}",
            "ref": "${GITHUB_REF_NAME}",
            "runId": "${GITHUB_RUN_ID}",
            "builtAt": "$(date -u +%FT%TZ)",
            "node": "$(node -v)"
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: standalone
          path: .next/standalone/
          retention-days: 1

  # ─── مرحله ۲: دیپلوی سایت به میزبان‌فا (FTP) ───────────
  deploy-site:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: standalone
          path: .next/standalone/

      - name: Sync via FTP to Mizbanfa
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./ehsansalehi.ir/
          local-dir: .next/standalone/
          state-name: .sync-state-${{ github.run_id }}.json
          timeout: 120000
          security: loose
          passive: true

      - name: Verify site health
        run: |
          sleep 8
          DEPLOYED=$(curl -sS --max-time 20 "${{ secrets.HEALTH_URL }}" \
            | grep -o '"shortSha":"[^"]*"' | cut -d'"' -f4 || echo "?")
          EXPECTED="${GITHUB_SHA:0:7}"
          echo "نسخه روی سایت: $DEPLOYED"
          echo "نسخه مورد انتظار: $EXPECTED"
          if [ "$DEPLOYED" = "$EXPECTED" ]; then
            echo "::notice::✅ نسخه صحیح منتشر شد"
          else
            echo "::warning::نسخه‌ها مطابقت ندارند (ممکن است کش باشد)"
          fi

  # ─── مرحله ۳: دیپلوی رله PHP به هاستینگر (SSH) ─────────
  deploy-relay:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # آپلود فایل‌های رله PHP از طریق SSH (دانلود مستقیم از GitHub)
      - name: Deploy relay.php via SSH (download from GitHub)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_IP }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd "$HOME/public_html"
            
            # Download relay.php from GitHub raw
            curl -sSL --max-time 30 -o relay.php.new               "https://raw.githubusercontent.com/ehsansalehi63/ehsansalehi.ir/main/relay-php/relay.php"
            
            # Download .htaccess from GitHub raw
            curl -sSL --max-time 30 -o .htaccess.new               "https://raw.githubusercontent.com/ehsansalehi63/ehsansalehi.ir/main/relay-php/.htaccess"
            
            # Check if downloads succeeded (files should contain PHP/Apache content)
            if grep -q '<?php' relay.php.new && grep -q 'RewriteRule' .htaccess.new; then
              mv relay.php.new relay.php
              mv .htaccess.new .htaccess
              chmod 644 relay.php .htaccess
              echo "✅ relay.php and .htaccess updated successfully"
              
              # Show version to confirm
              grep "version.*=>" relay.php | head -1
            else
              echo "❌ Download failed — keeping old files"
              cat relay.php.new | head -5
              rm -f relay.php.new .htaccess.new
              exit 1
            fi
            
            # Disable OPcache via .user.ini (PHP-FPM reads this)
            echo 'opcache.enable=0' > .user.ini
            echo "Created .user.ini to disable OPcache"
            
            # Wait for PHP-FPM to pick up .user.ini changes
            echo "Waiting 10s for .user.ini to take effect..."
            sleep 10
            
            # Verify the new version is live
            HEALTH=$(curl -sS --max-time 10 "https://darkslategrey-woodcock-525023.hostingersite.com/health" 2>/dev/null || echo "{}")
            echo "Health check after .user.ini: $HEALTH"
            
            # If still old version, try renaming trick (forces recompile)
            if echo "$HEALTH" | grep -q '"version": "1.0"'; then
              echo "Still old version, trying rename trick..."
              cp relay.php relay_tmp.php
              mv relay.php relay_old.php
              mv relay_tmp.php relay.php
              rm -f relay_old.php
              sleep 3
              HEALTH2=$(curl -sS --max-time 10 "https://darkslategrey-woodcock-525023.hostingersite.com/health" 2>/dev/null || echo "{}")
              echo "Health check after rename: $HEALTH2"
            fi


      # مطمئن شو relay-config.php وجود دارد (اگر نبود نمونه بساز)
      - name: Ensure relay-config.php exists (SSH)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_IP }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            CONFIG_FILE="$HOME/public_html/relay-config.php"
            if [ ! -f "$CONFIG_FILE" ]; then
              cat > "$CONFIG_FILE" <<'PHPCONFIG'
            <?php
            return [
                'relay_secret'      => '',
                'ai_gateway_key'    => '',
                'openai_api_key'    => '',
                'openai_base'       => 'https://agentrouter.org/v1',
                'anthropic_base'    => 'https://agentrouter.org',
                'anthropic_version' => '2023-06-01',
                'instagram_token'   => '',
                'instagram_user_id' => '',
                'linkedin_token'    => '',
                'linkedin_author'   => '',
                'fb_token'          => '',
                'fb_page_id'        => '',
                'meta_version'      => 'v21.0',
                'sig_window'        => 300,
            ];
            PHPCONFIG
              echo "relay-config.php نمونه ساخته شد"
            else
              echo "relay-config.php از قبل وجود دارد"
            fi
            chmod 600 "$CONFIG_FILE" 2>/dev/null || true

      # دیباگ: مسیر واقعی document root و فایل رله
      - name: Debug document root (SSH)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_IP }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "=== HOME ==="
            echo $HOME
            echo "=== public_html contents ==="
            ls -la "$HOME/public_html/" | head -20
            echo "=== relay.php version on disk ==="
            grep "'version'" "$HOME/public_html/relay.php"
            echo "=== .user.ini ==="
            cat "$HOME/public_html/.user.ini" 2>/dev/null || echo "no .user.ini"
            echo "=== Create test file ==="
            echo "TEST_FILE_OK_$(date +%s)" > "$HOME/public_html/debug-test.txt"
            echo "Test file created"
            echo "=== Check via HTTP ==="
            curl -sS --max-time 10 "https://darkslategrey-woodcock-525023.hostingersite.com/debug-test.txt" 2>/dev/null || echo "HTTP_FAILED"
            rm -f "$HOME/public_html/debug-test.txt"
            echo "=== PHP info via temp file ==="
            echo '<?php echo "DOC_ROOT=" . $_SERVER["DOCUMENT_ROOT"] . "\n"; echo "FILE=" . __FILE__ . "\n"; opcache_reset(); echo "OPCACHE_RESET_OK\n";' > "$HOME/public_html/_debug_phpinfo.php"
            curl -sS --max-time 10 "https://darkslategrey-woodcock-525023.hostingersite.com/_debug_phpinfo.php" 2>/dev/null || echo "HTTP_FAILED"
            rm -f "$HOME/public_html/_debug_phpinfo.php"

      # بررسی سلامت رله
      - name: Verify relay health
        run: |
          sleep 3
          RELAY_DOMAIN="${{ vars.RELAY_DOMAIN || 'darkslategrey-woodcock-525023.hostingersite.com' }}"
          echo "Testing relay: https://$RELAY_DOMAIN/health"
          HTTP=$(curl -sS -o /tmp/relay-health.json -w "%{http_code}" \
            --max-time 15 "https://$RELAY_DOMAIN/health" 2>/dev/null || true)
          HTTP=${HTTP:-000}
          if [ "$HTTP" = "200" ]; then
            echo "::notice::✅ رله PHP سالم است"
            cat /tmp/relay-health.json
          else
            echo "::warning::⚠️ رله پاسخ 200 نداد (HTTP $HTTP)"
          fi

      # بررسی امنیتی: فایل کانفیگ نباید قابل خواندن باشد
      - name: Security check — relay-config.php not publicly readable
        run: |
          RELAY_DOMAIN="${{ vars.RELAY_DOMAIN || 'darkslategrey-woodcock-525023.hostingersite.com' }}"
          HTTP=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 10 "https://$RELAY_DOMAIN/relay-config.php" 2>/dev/null || true)
          HTTP=${HTTP:-000}
          if [ "$HTTP" = "200" ]; then
            echo "::error::❌ relay-config.php قابل خواندن است!"
          else
            echo "::notice::✅ relay-config.php محافظت شده (HTTP $HTTP)"
          fi

  # ─── مرحله ۴: تست سرتاسری زنجیره ──────────────────────
  test-chain:
    needs: [deploy-site, deploy-relay]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Run chain test (site ↔ relay)
        env:
          SITE_URL:     https://ehsansalehi.ir
          RELAY_URL:    ${{ secrets.RELAY_URL }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          CRON_SECRET:  ${{ secrets.CRON_SECRET }}
        run: |
          chmod +x tools/test-chain.sh
          bash tools/test-chain.sh | tee chain-report.txt

      - name: Test SSH connectivity to Hostinger
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_IP }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "✅ SSH به هاستینگر وصل شد"
            echo "Uptime: $(uptime)"
            echo "Disk: $(df -h / | tail -1)"
            echo "PHP: $(php -v 2>/dev/null | head -1 || echo 'نامشخص')"
            echo ""
            echo "Test relay from inside Hostinger:"
            curl -sS --max-time 15 "http://localhost/health" 2>&1 || echo "رله روی localhost در دسترس نیست"

      - name: Summary
        if: always()
        run: |
          {
            echo '## گزارش تست زنجیره (پس از دیپلوی)'
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' chain-report.txt 2>/dev/null || echo 'گزارشی تولید نشد'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
