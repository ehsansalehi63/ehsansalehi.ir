name: Deploy Relay Only

on:
  workflow_dispatch:

concurrency:
  group: deploy-relay-only
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Find document root and deploy relay
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_IP }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "=== HOME ==="
            echo $HOME
            echo "=== Find relay.php everywhere ==="
            find "$HOME" -name "relay.php" -type f 2>/dev/null
            echo "=== Find .htaccess with relay rules ==="
            find "$HOME" -name ".htaccess" -exec grep -l "relay" {} \; 2>/dev/null
            echo "=== Check domains directory ==="
            ls -la "$HOME/domains/" 2>/dev/null || echo "no domains dir"
            echo "=== Check public_html ==="
            ls -la "$HOME/public_html/" 2>/dev/null | head -15
            echo "=== Find document root via PHP ==="
            echo '<?php echo "DOC_ROOT=" . $_SERVER["DOCUMENT_ROOT"] . "\n"; ?>' > /tmp/find_docroot.php
            # Try common locations
            for dir in "$HOME/public_html" "$HOME/domains"/*/public_html "$HOME/domains/darkslategrey-woodcock-525023.hostingersite.com/public_html"; do
              if [ -d "$dir" ]; then
                cp /tmp/find_docroot.php "$dir/_find_docroot.php"
                echo "Trying: $dir"
              fi
            done
            
            # Check the actual web root by looking at the Hostinger config
            echo "=== hPanel config ==="
            cat "$HOME/.hpanel" 2>/dev/null || echo "no .hpanel"
            ls "$HOME/" 2>/dev/null
            
            echo "=== Try accessing _find_docroot from different paths ==="
            curl -sS --max-time 10 "https://darkslategrey-woodcock-525023.hostingersite.com/_find_docroot.php" 2>/dev/null || echo "FAILED at public_html"
