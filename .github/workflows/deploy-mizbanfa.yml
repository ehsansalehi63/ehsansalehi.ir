name: Deploy to Mizbanfa cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-mizbanfa-cpanel
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm' # فعال‌سازی کش برای سرعت ۱۰ برابری نصب

      - name: Install Dependencies
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build Project
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ehsansalehi.ir

      - name: Prepare Standalone output for FTP
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          mkdir -p .next/standalone/tmp
          touch .next/standalone/tmp/restart.txt
          # بهینه‌سازی آپلود: حذف فایل‌های بزرگ و غیرضروری از output نهایی
          rm -rf .next/standalone/*.tar.gz .next/standalone/*.tar .next/standalone/*.backup 2>/dev/null || true

      - name: Sync Files via FTP to Mizbanfa
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          server-dir: ./ehsansalehi.ir/
          local-dir: .next/standalone/
          # State ثابت برای Incremental FTP
          state-name: .ftp-deploy-sync-state.json
          # تایم‌اوت طولانی برای رفع Timeout (control socket)
          timeout: 300000
          log-level: verbose
          # بهینه‌سازی آپلود: حذف .git و فایل‌های بزرگ، حفظ node_modules در standalone برای اجرای مستقل
          exclude: |
            **/.git*
            **/.git*/**
            **/*.tar.gz
            **/*.tar
            **/*.backup
            **/*.log
