# ═══════════════════════════════════════════════════════════════
#  دیپلوی سریع به میزبان‌فا — از طریق SSH
#
#  Secrets لازم:
#    SSH_IP           آدرس IP سرور میزبان‌فا
#    SSH_PORT         پورت SSH (معمولاً 22)
#    SSH_USERNAME     نام کاربری SSH
#    SSH_PASSWORD     رمز عبور SSH
#    FTP_SERVER       آدرس FTP میزبان‌فا (برای دیپلوی قدیمی)
#    FTP_USERNAME     نام کاربری FTP
#    FTP_PASSWORD     رمز FTP
#    HEALTH_URL       https://ehsansalehi.ir/api/health
# ═══════════════════════════════════════════════════════════════

name: Deploy to Mizbanfa (SSH)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      method:
        description: 'روش دیپلوی'
        type: choice
        options: [ssh, ftp]
        default: ssh

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ─── ۱) دریافت کد ──────────────────────────────────
      - uses: actions/checkout@v4

      # ─── ۲) Node با کش ─────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ─── ۳) کش build نکست ──────────────────────────────
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.[jt]s','**/*.[jt]sx') }}
          restore-keys: |
            next-${{ hashFiles('package-lock.json') }}-
            next-

      # ─── ۴) نصب پکیج‌ها (اینترنت آزاد، سریع) ───────────
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      # ─── ۵) ساخت پروژه ─────────────────────────────────
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ehsansalehi.ir
          NEXT_TELEMETRY_DISABLED: '1'

      # ─── ۶) ساخت بسته فشرده ────────────────────────────
      #  کلید سرعت: به‌جای هزاران فایل، یک فایل ~۱۵ مگابایتی
      - name: Create bundle
        id: bundle
        run: |
          set -euo pipefail
          OUT=.next/standalone

          # فایل‌های استاتیک و public را کنار standalone بگذار
          cp -r public "$OUT/public"
          mkdir -p "$OUT/.next"
          cp -r .next/static "$OUT/.next/static"
          mkdir -p "$OUT/tmp"
          date -u +%FT%TZ > "$OUT/tmp/restart.txt"

          # اطلاعات نسخه برای health check
          cat > "$OUT/deploy-info.json" <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "shortSha": "${GITHUB_SHA:0:7}",
            "ref": "${GITHUB_REF_NAME}",
            "runId": "${GITHUB_RUN_ID}",
            "builtAt": "$(date -u +%FT%TZ)",
            "node": "$(node -v)"
          }
          EOF

          mkdir -p dist
          BUNDLE="dist/bundle-${GITHUB_RUN_ID}.tar.gz"

          # فشرده‌سازی حداکثری برای کمترین حجم انتقال
          tar --exclude='./node_modules/.cache' \
              -C "$OUT" -cf - . | gzip -9 > "$BUNDLE"

          SIZE=$(du -h "$BUNDLE" | cut -f1)
          echo "path=$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "::notice::حجم بسته: $SIZE"
          ls -lh "$BUNDLE"

      # ─── ۷) دیپلوی SSH ─────────────────────────────────
      - name: Deploy via SSH
        if: ${{ inputs.method == 'ssh' || inputs.method == '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_IP }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: ${{ steps.bundle.outputs.path }}
          target: ~/incoming/
          strip_components: 1

      - name: Extract and restart via SSH
        if: ${{ inputs.method == 'ssh' || inputs.method == '' }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_IP }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            APP_DIR="$HOME/ehsansalehi.ir"
            BUNDLE="$HOME/incoming/bundle-${{ github.run_id }}.tar.gz"
            
            echo "📦 استخراج بسته..."
            mkdir -p "$APP_DIR"
            # بکاپ سریع از فایل‌های مهم
            if [ -f "$APP_DIR/.env" ]; then
              cp "$APP_DIR/.env" "$APP_DIR/.env.bak"
            fi
            # استخراج بسته
            tar -xzf "$BUNDLE" -C "$APP_DIR"
            # برگرداندن .env
            if [ -f "$APP_DIR/.env.bak" ]; then
              mv "$APP_DIR/.env.bak" "$APP_DIR/.env"
            fi
            
            echo "🔄 ری‌استارت اپ..."
            # توش touch به فایل restart.txt اپ نکست را می‌فهماند ری‌استارت شود
            date -u +%FT%TZ > "$APP_DIR/tmp/restart.txt"
            
            # پاکسازی فایل موقت
            rm -f "$BUNDLE"
            
            echo "✅ دیپلوی کامل شد: $(date -u +%FT%TZ)"

      # ─── ۷-ب) دیپلوی FTP (پشتیبان) ─────────────────────
      - name: Deploy via FTP (fallback)
        if: ${{ inputs.method == 'ftp' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./ehsansalehi.ir/
          local-dir: .next/standalone/
          state-name: .sync-state-${{ github.run_id }}.json
          timeout: 120000
          security: loose
          passive: true

      # ─── ۸) تأیید نهایی نسخه منتشرشده ──────────────────
      - name: Verify deployed version
        run: |
          sleep 8
          DEPLOYED=$(curl -sS --max-time 20 "${{ secrets.HEALTH_URL }}" \
            | grep -o '"shortSha":"[^"]*"' | cut -d'"' -f4 || echo "?")
          EXPECTED="${GITHUB_SHA:0:7}"
          echo "نسخه روی سایت: $DEPLOYED"
          echo "نسخه مورد انتظار: $EXPECTED"
          if [ "$DEPLOYED" = "$EXPECTED" ]; then
            echo "::notice::✅ نسخه صحیح منتشر شد"
          else
            echo "::warning::نسخه‌ها مطابقت ندارند (ممکن است کش باشد)"
          fi

      # ─── ۹) نگهداری بسته برای بازگشت اضطراری ───────────
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-${{ github.run_id }}
          path: dist/*.tar.gz
          retention-days: 7
