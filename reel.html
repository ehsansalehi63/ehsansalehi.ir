<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow: hidden; background: #0c1124; height: 100%; }
#wrapper {
  width: calc(100vh * 9 / 16);
  height: 100vh;
  margin: 0 auto;
  position: relative;
  background: linear-gradient(160deg, #0c1124 0%, #1a0f3d 40%, #2d1255 70%, #1e1147 100%);
  font-family: 'Vazirmatn', sans-serif;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 12vh 8% 6vh;
}
.glow { position: absolute; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; }
.g1 { width: 50%; height: 25%; background: #fbbf24; top: 3%; left: 50%; transform: translateX(-50%); opacity: 0.12; }
.g2 { width: 35%; height: 20%; background: #38bdf8; bottom: 10%; right: -8%; opacity: 0.08; }
.header { display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 10; flex-shrink: 0; }
.header-line { width: 50px; height: 4px; background: #fbbf24; border-radius: 2px; }
.title { font-size: 2.8vw; font-weight: 900; color: #fbbf24; text-shadow: 0 2px 20px rgba(251,191,36,0.35); }
.content { z-index: 10; text-align: center; display: flex; flex-direction: column; gap: 1.2vh; flex-grow: 1; justify-content: center; }
.content p { font-size: 2.6vw; font-weight: 700; color: #fff; line-height: 1.5; text-shadow: 0 4px 30px rgba(0,0,0,0.6); }
.question { z-index: 10; padding: 1vh 2.5vw; border: 2px solid #38bdf8; border-radius: 100px; font-size: 2.2vw; font-weight: 500; color: #38bdf8; background: rgba(56,189,248,0.06); white-space: nowrap; flex-shrink: 0; }
.bottom { display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 10; flex-shrink: 0; }
.handle { font-size: 2.2vw; font-weight: 500; color: #94a3b8; direction: ltr; }
.bottom-line { width: 50px; height: 4px; background: #fbbf24; border-radius: 2px; }
</style>
</head>
<body>
<div id="wrapper">
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="header">
    <div class="header-line"></div>
    <div class="title">پیام روز</div>
  </div>
  <div class="content">
    <p>موفقیت نتیجه تصمیمات کوچک روزانه‌است.</p>
    <p>هر قدمی که امروز برمی‌دارید، شما را به رویای بزرگ‌تان نزدیک‌تر می‌کند.</p>
    <p>تکنولوژی هم تنها ابزاری‌ست برای تحقق این تصمیمات.</p>
    <p>پس امروز شروع کنید!</p>
  </div>
  <div class="question">شما چطور هر روز رشد می‌کنید؟</div>
  <div class="bottom">
    <div class="handle">@ehsansalehi.ir</div>
    <div class="bottom-line"></div>
  </div>
</div>
</body>
</html>
