services:
  - type: web
    name: arena-social-mcp
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MCP_PUBLIC_BASE_URL
        sync: false
      - key: MCP_BEARER_TOKEN
        generateValue: true
      - key: MCP_STORAGE_BACKEND
        value: file
      - key: MAKE_BRIDGE_ENABLED
        value: true
      - key: MAKE_BRIDGE_PLATFORMS
        value: instagram,facebook,linkedin,telegram
      - key: MAKE_BRIDGE_PUBLISH_WEBHOOK_URL
        sync: false
      - key: MAKE_BRIDGE_TEST_WEBHOOK_URL
        sync: false
      - key: MAKE_BRIDGE_CONNECTION_LABEL
        value: Make Bridge
      - key: MAKE_BRIDGE_AUTH_HEADER_NAME
        sync: false
      - key: MAKE_BRIDGE_AUTH_HEADER_VALUE
        sync: false
