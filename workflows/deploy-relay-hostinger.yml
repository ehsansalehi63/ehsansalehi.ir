# ═══════════════════════════════════════════════════════════════
#  دیپلوی رله هاستینگر — از طریق SSH
#
#  Secrets لازم:
#    SSH_IP           آدرس IP هاستینگر
#    SSH_PORT         پورت SSH
#    SSH_USERNAME     نام کاربری SSH
#    SSH_PASSWORD     رمز عبور SSH
# ═══════════════════════════════════════════════════════════════

name: Deploy Relay to Hostinger (SSH)

on:
  push:
    branches: [main]
    paths:
      - 'relay/**'
      - 'relay-php/**'
      - '.github/workflows/deploy-relay-hostinger.yml'
  workflow_dispatch:

concurrency:
  group: deploy-relay
  cancel-in-progress: false

jobs:
  deploy-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # ─── ۱) آپلود فایل‌های رله PHP ─────────────────────
      - name: Deploy PHP relay via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_IP }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "relay-php/relay.php,relay-php/.htaccess"
          target: ~/public_html/
          strip_components: 1

      # ─── ۲) تست سلامت رله ──────────────────────────────
      - name: Verify relay health
        run: |
          sleep 3
          # آدرس رله — اگر دامنه دیگری دارید، اینجا عوض کنید
          RELAY_DOMAIN="${{ vars.RELAY_DOMAIN || 'darkslategrey-woodcock-525023.hostingersite.com' }}"

          echo "🔍 تست /health روی $RELAY_DOMAIN ..."
          HTTP_CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" \
            --max-time 15 "https://$RELAY_DOMAIN/health" 2>&1 || echo "000")

          echo "HTTP Code: $HTTP_CODE"
          cat /tmp/health.json 2>/dev/null || echo "(بدون پاسخ)"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "::notice::✅ رله PHP سالم است"
          else
            echo "::warning::⚠️ رله پاسخ 200 نداد (HTTP $HTTP_CODE) — ممکن است نیاز به تنظیم relay-config.php داشته باشد"
          fi

      # ─── ۳) بررسی امنیتی: فایل کانفیگ نباید قابل خواندن باشد ──
      - name: Security check — relay-config.php not readable
        run: |
          RELAY_DOMAIN="${{ vars.RELAY_DOMAIN || 'darkslategrey-woodcock-525023.hostingersite.com' }}"
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 10 "https://$RELAY_DOMAIN/relay-config.php" 2>&1 || echo "000")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "::error::❌ فایل relay-config.php قابل خواندن است! دسترسی آن را محدود کنید"
          else
            echo "::notice::✅ فایل relay-config.php قابل خواندن نیست (HTTP $HTTP_CODE)"
          fi
