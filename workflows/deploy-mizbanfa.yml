# ═══════════════════════════════════════════════════════════════
# ریق FTP
#
#  FTP فقط برای میزبان‌فا (سایت اصلی Next.js)
#  SSH فقط برای هاستینگر (رله) — ورک‌فلو جدا
#
#  Secrets لازم:
#    FTP_SERVER       آدرس FTP میزبان‌فا
#    FTP_USERNAME     نام کاربری FTP
#    FTP_PASSWORD     رمز FTP
#    HEALTH_URL       https://ehsansalehi.ir/api/deploy/health
# ═══════════════════════════════════════════════════════════════

name: Deploy Site to Mizbanfa (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ─── ۱) دریافت کد ──────────────────────────────────
      - uses: actions/checkout@v4

      # ─── ۲) Node با کش ─────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ─── ۳) کش build نکست ──────────────────────────────
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.[jt]s','**/*.[jt]sx') }}
          restore-keys: |
            next-${{ hashFiles('package-lock.json') }}-
            next-

      # ─── ۴) نصب پکیج‌ها (اینترنت آزاد، سریع) ───────────
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      # ─── ۵) ساخت پروژه ─────────────────────────────────
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ehsansalehi.ir
          NEXT_TELEMETRY_DISABLED: '1'

      # ─── ۶) آماده‌سازی خروجی standalone ─────────────────
      - name: Prepare standalone output
        run: |
          set -euo pipefail
          OUT=.next/standalone

          # فایل‌های استاتیک و public را کنار standalone بگذار
          cp -r public "$OUT/public"
          mkdir -p "$OUT/.next"
          cp -r .next/static "$OUT/.next/static"
          mkdir -p "$OUT/tmp"
          date -u +%FT%TZ > "$OUT/tmp/restart.txt"

          # اطلاعات نسخه برای health check
          cat > "$OUT/deploy-info.json" <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "shortSha": "${GITHUB_SHA:0:7}",
            "ref": "${GITHUB_REF_NAME}",
            "runId": "${GITHUB_RUN_ID}",
            "builtAt": "$(date -u +%FT%TZ)",
            "node": "$(node -v)"
          }
          EOF

      # ─── ۷) دیپلوی FTP به میزبان‌فا ─────────────────────
      - name: Sync via FTP to Mizbanfa
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./ehsansalehi.ir/
          local-dir: .next/standalone/
          state-name: .sync-state-${{ github.run_id }}.json
          timeout: 120000
          security: loose
          passive: true

      # ─── ۸) تأیید نهایی نسخه منتشرشده ──────────────────
      - name: Verify deployed version
        run: |
          sleep 8
          DEPLOYED=$(curl -sS --max-time 20 "${{ secrets.HEALTH_URL }}" \
            | grep -o '"shortSha":"[^"]*"' | cut -d'"' -f4 || echo "?")
          EXPECTED="${GITHUB_SHA:0:7}"
          echo "نسخه روی سایت: $DEPLOYED"
          echo "نسخه مورد انتظار: $EXPECTED"
          if [ "$DEPLOYED" = "$EXPECTED" ]; then
            echo "::notice::✅ نسخه صحیح منتشر شد"
          else
            echo "::warning::نسخه‌ها مطابقت ندارند (ممکن است کش باشد)"
          fi
