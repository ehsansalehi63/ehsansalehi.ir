<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.003/Vazirmatn-font-face.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width: 1080px;
  height: 1920px;
  font-family: 'Vazirmatn', sans-serif;
  background: url('https://media.base44.com/images/public/6a6f623f483e55c56d55ce16/07c4be979_generated_image.png') center/cover no-repeat;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 0 60px 200px;
  position: relative;
  overflow: hidden;
}
body::before {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 60%;
  background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.7) 40%, rgba(0,0,0,0) 100%);
  z-index: 0;
}
.text-box {
  position: relative;
  z-index: 1;
  text-align: center;
}
h1 {
  font-size: 62px;
  font-weight: 800;
  line-height: 1.4;
  color: #ffffff;
  text-shadow: 0 4px 24px rgba(0,0,0,0.8), 0 0 60px rgba(168,85,247,0.3);
}
.brand {
  margin-top: 40px;
  font-size: 28px;
  font-weight: 600;
  color: #c084fc;
  opacity: 0.9;
}
</style>
</head>
<body>
  <div class="text-box">
    <h1>انقلاب هوش مصنوعی فیزیکی در سال ۲۰۲۶</h1>
    <div class="brand">@ehsansalehi.ir</div>
  </div>
</body>
</html>
