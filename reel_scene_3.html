<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<style>
@import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; overflow:hidden; background:#000; font-family:'Vazirmatn',sans-serif; }
.bg { position:absolute; top:0; left:0; width:1080px; height:1920px; background-image:url('https://media.base44.com/images/public/6a6f623f483e55c56d55ce16/a654350bb_generated_image.png'); background-size:cover; background-position:center; }
.bg::after { content:''; position:absolute; top:0; left:0; width:100%; height:100%; background:linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.2) 55%, rgba(0,0,0,0.75) 100%); }
.text { position:absolute; bottom:350px; left:50%; transform:translateX(-50%); text-align:center; width:88%; z-index:10; }
.text p { color:#fff; font-size:62px; font-weight:700; line-height:1.6; text-shadow:0 4px 20px rgba(0,0,0,0.9), 0 2px 8px rgba(0,0,0,0.95); }
</style>
</head>
<body>
<div class="bg"></div>
<div class="text"><p>تکنولوژی تنها ابزاری است<br>برای تحقق این تصمیمات</p></div>
</body>
</html>
