<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; overflow:hidden; font-family:'Vazirmatn',sans-serif; }
.scene { position:relative; width:1080px; height:1920px; background:url('https://media.base44.com/images/public/6a6f623f483e55c56d55ce16/5624b8e5b_generated_image.png') center/cover no-repeat; }
.scene::before { content:''; position:absolute; top:0; left:0; right:0; bottom:0; background:linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 25%, transparent 50%, rgba(0,0,0,0.9) 100%); }
.badge { position:absolute; top:80px; right:80px; background:rgba(0,0,0,0.7); color:#fff; padding:16px 32px; border-radius:12px; font-size:36px; font-weight:700; border:2px solid rgba(255,255,255,0.3); backdrop-filter:blur(10px); }
.title-block { position:absolute; bottom:200px; left:60px; right:60px; text-align:center; }
.title { font-size:72px; font-weight:800; color:#fff; text-shadow: 0 4px 20px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.7); line-height:1.4; }
.brand { position:absolute; bottom:60px; left:0; right:0; text-align:center; color:rgba(255,255,255,0.7); font-size:32px; font-weight:500; }
.date { position:absolute; top:80px; left:80px; color:rgba(255,255,255,0.6); font-size:28px; }
</style>
</head>
<body>
<div class="scene">
  <div class="badge">خبر ۴</div>
  <div class="date">۴ مرداد ۱۴۰۵</div>
  <div class="title-block">
    <div class="title">هوش مصنوعی در داروسازی: بازار ۱۹ میلیارد دلاری تا ۲۰۳۴</div>
  </div>
  <div class="brand">@ehsansalehi.ir</div>
</div>
</body>
</html>
